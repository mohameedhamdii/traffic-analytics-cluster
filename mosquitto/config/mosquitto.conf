# Mosquitto MQTT Broker Configuration
# Reference: https://mosquitto.org/man/mosquitto-conf-5.html

# ─── General ────────────────────────────────────────────────────────────────
pid_file /mosquitto/data/mosquitto.pid
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# ─── Listener: Standard MQTT (TCP) ──────────────────────────────────────────
listener 1883
protocol mqtt

# Allow anonymous connections within the cluster network.
# On production, replace with password_file and acl_file.
allow_anonymous true

# ─── Listener: MQTT over WebSockets ─────────────────────────────────────────
listener 9001
protocol websockets
allow_anonymous true

# ─── Message Size ────────────────────────────────────────────────────────────
message_size_limit 0

# ─── Retained Messages ──────────────────────────────────────────────────────
retained_persistence true

# ─── Queue Limits ────────────────────────────────────────────────────────────
# Maximum number of QoS 1/2 messages in the queue per client
max_queued_messages 1000

# ─── Connection Keep-alive ───────────────────────────────────────────────────
keepalive_interval 60
