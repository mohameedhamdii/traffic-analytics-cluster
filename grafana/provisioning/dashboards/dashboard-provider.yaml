# Grafana dashboard provider — auto-load dashboards from /var/lib/grafana/dashboards
# Reference: https://grafana.com/docs/grafana/latest/administration/provisioning/

apiVersion: 1

providers:
  - name: "Traffic Analytics"
    orgId: 1
    folder: "Smart City Traffic"
    folderUid: "smartcity-traffic"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
